<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天文实验室 · 设计预览</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e8df;color:#283d34;font:16px system-ui}header{padding:14px 3vw;background:#f8f8ee;display:flex;gap:10px 26px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}nav{display:flex;gap:5px;flex-wrap:wrap}button{font:inherit;font-size:14px;padding:7px 10px;color:inherit;background:transparent;border:1px solid #c2cec4;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#305a49;color:white}img{display:block;width:100%;max-height:calc(100svh - 82px);object-fit:contain;object-position:top center;margin:12px auto}</style><header><h1>天文实验室 · 设计预览</h1><nav aria-label="选择预览画面"><button data-id="solar" aria-pressed="true">太阳全景</button><button data-id="site0" aria-pressed="false">最小楼间距</button><button data-id="site1" aria-pressed="false">太阳能热水器倾角</button><button data-id="site2" aria-pressed="false">垂直物体影长</button><button data-id="site3" aria-pressed="false">室内采光</button><button data-id="site4" aria-pressed="false">遮阳板</button><button data-id="phase" aria-pressed="false">月相实验</button><button data-id="eclipse" aria-pressed="false">月食模拟</button></nav></header><img src="solar.jpg" alt="太阳全景"><script>const img=document.querySelector("img");for(const b of document.querySelectorAll("button"))b.onclick=()=>{document.querySelector("[aria-pressed=true]").setAttribute("aria-pressed","false");b.setAttribute("aria-pressed","true");img.src=b.dataset.id+".jpg";img.alt=b.textContent};</script></html>
